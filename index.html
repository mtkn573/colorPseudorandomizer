<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorPseudorandomizer</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family:Inter;
            font-size:10px;
        }
        html,body{
            height:100%;
        }
        #generatedColor{
            background-color:rgba(random(0,255),random(0,255),random(0,255),random(0,255));
        }
        #savedColors{
            width:100%;
            display:flex;
            gap:8px;
            overflow-x:auto;
            overflow-y:hidden;
        }
        #savedColors>div{
            flex:0 0 120px;
        }
    </style>
</head>
<body>
    <div style="display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;">
        <div id="savedColorsLabel" style="width:100%;display:none;">saved colors:</div>
        <div id="savedColors"></div>
        <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;">
            <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
                <div>generated color:</div>
                <div id="generatedColor" style="width:64%;height:41px;border-style:solid;border-width:1px;border-radius:7px;"></div>
            </div>
            <div style="width:100%;display:flex;justify-content:center;">
                <div id="generateColor" style="background-image:linear-gradient(to right, #009CBB , #6DC5FF);width:41%;height:18px;display:flex;justify-content:center;align-items:center;border-radius:6px;">generate color</div>
                <div id="saveColor" style="background-image:linear-gradient(to right, #007E08 , #00FF22);width:41%;height:18px;display:flex;justify-content:center;align-items:center;border-radius:6px;">save color</div>
            </div>
        </div>
    </div>
    <script>
        function colorToHex(color){
            channels=color.match(/\d+/g)
            if(!channels||channels.length<3){
                return color
            }
            return `#${channels.slice(0,3).map(value=>Number(value).toString(16).padStart(2,`0`)).join(``)}`
        }
        isAndroid=/Android/i.test(navigator.userAgent)
        isIos=/iPad|iPhone|iPod/.test(navigator.platform)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)
        if(!isAndroid&&!isIos){
            document.body.innerHTML="using app is i guess available on devices with ios or android."
            document.body.style.fontSize="30px"
            document.body.style.display="flex"
            document.body.style.justifyContent="center"
            document.body.style.alignItems="center"
        }else{
            document.getElementById(`generateColor`).addEventListener(`click`,function(){
                location.reload()
            })
            document.getElementById(`saveColor`).addEventListener(`click`,function(){
                colorValue=colorToHex(getComputedStyle(document.getElementById(`generatedColor`)).backgroundColor)
                data=localStorage.getItem(`data`)
                if(data==null){
                    data=`<root></root>`
                }
                domParser=new DOMParser()
                xmlDocument=domParser.parseFromString(data,`text/xml`)
                color=xmlDocument.createElement(`color`)
                color.textContent=colorValue
                xmlDocument.getElementsByTagName(`root`)[0].appendChild(color)
                localStorage.setItem(`data`,new XMLSerializer().serializeToString(xmlDocument))
                document.getElementById(`savedColors`).innerHTML+=`<div><div>${colorValue}</div><div style="width:100%;height:87px;background-color:${colorValue};border-style:solid;border-width:1px;border-radius:7px;"></div></div>`
                document.getElementById(`savedColorsLabel`).style.display=`block`
            })
            data=localStorage.getItem(`data`)
            if(data!=null){
                domParser=new DOMParser()
                xmlDocument=domParser.parseFromString(data,`text/xml`)
                console.log(`root: ${xmlDocument.getElementsByTagName(`root`).length}`)
                console.log(xmlDocument.getElementsByTagName(`root`)[0].getElementsByTagName(`color`).length);
                if(xmlDocument.getElementsByTagName(`root`)[0].getElementsByTagName(`color`).length>0){
                    console.log(xmlDocument.getElementsByTagName(`root`)[0].getElementsByTagName(`color`)[0].innerHTML)
                }
                for(i=0;i<xmlDocument.getElementsByTagName(`root`)[0].getElementsByTagName(`color`).length;i++){
                    document.getElementById(`savedColors`).innerHTML+=`<div><div>${xmlDocument.getElementsByTagName(`root`)[0].getElementsByTagName(`color`)[i].textContent}</div><div style="width:100%;height:87px;background-color:${xmlDocument.getElementsByTagName(`root`)[0].getElementsByTagName(`color`)[i].textContent};border-style:solid;border-width:1px;border-radius:7px;"></div></div>`
                    document.getElementById(`savedColorsLabel`).style.display=`block`
                }
            }
        }
    </script>
</body>
</html>
